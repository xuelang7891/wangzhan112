<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面走丢了 - 薛朗的资源仓库</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #F5F6F7;
    --surface: #FFFFFF;
    --text: #262A2F;
    --text-2: #6E767E;
    --accent: #0E7C66;
    --accent-dark: #0A5C4C;
    --border: #E3E7EA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(23, 27, 32, 0.06);
  }
  .code {
    font-size: 64px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 4px;
    line-height: 1;
  }
  h1 {
    margin-top: 18px;
    font-size: 22px;
    font-weight: 700;
  }
  p {
    margin-top: 10px;
    color: var(--text-2);
    font-size: 14.5px;
    line-height: 1.7;
  }
  .btn {
    display: inline-block;
    margin-top: 26px;
    padding: 12px 28px;
    border-radius: 10px;
    background: var(--accent);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.18s ease;
  }
  .btn:hover { background: var(--accent-dark); }
  .hint {
    margin-top: 16px;
    font-size: 12.5px;
    color: #9AA1A9;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>页面走丢了</h1>
    <p>你访问的页面不存在或已被移动，<br>回到首页继续逛逛吧。</p>
    <a class="btn" href="/">返回首页</a>
    <p class="hint" id="hint">3 秒后自动跳转…</p>
  </div>
  <script>
    (function () {
      var n = 3;
      var hint = document.getElementById('hint');
      var timer = setInterval(function () {
        n -= 1;
        if (n <= 0) {
          clearInterval(timer);
          location.href = '/';
        } else {
          hint.textContent = n + ' 秒后自动跳转…';
        }
      }, 1000);
    })();
  </script>
</body>
</html>
